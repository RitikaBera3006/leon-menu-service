services:
  menu-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: leon-menu-service
    ports:
      - "8010:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DEBUG=${DEBUG:-true}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    volumes:
      - .:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - leon-menu-network

networks:
  leon-menu-network:
    driver: bridge
